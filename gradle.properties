android.useAndroidX=true
# The published version of BOTH artifacts (io.joryio:joryio-android and :joryio-android-ui).
# The backend's sdk-version-parity spec pins it to the other SDKs' versions.
joryioSdkVersion=1.4.0-beta.5
# The Gradle daemon's own memory. The default (512m heap, 384m metaspace) ran
# out of Metaspace building joryio-compose (Compose compiler + javadoc jar),
# and the daemon hung instead of failing. Build-only: no effect on consumers.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
